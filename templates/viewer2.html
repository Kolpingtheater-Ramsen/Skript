<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <script src="/static/js/client-error-reporter.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kolpingtheater Ramsen - Schauspieler-Viewer</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/static/css/viewer-actor.css" />

    <script>
        ;(() => {
            const isLocalhost =
                location.hostname === 'localhost' || location.hostname === '127.0.0.1'
            if (
                !('serviceWorker' in navigator) ||
                isLocalhost ||
                !location.protocol.startsWith('http')
            ) {
                return
            }

            let refreshing = false
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return
                refreshing = true
                window.location.reload()
            })

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => registration.update())
                    .catch((error) => {
                        console.warn('[SW] Viewer registration failed:', error)
                    })
            })
        })()
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="/static/js/vendor/papaparse.min.js"></script>
</head>

<body>
    <div class="header">
        <h1>🎭 Schauspieler-Viewer</h1>
        <div class="status-group">
            <span id="connection-status">🔄 Verbinde...</span>
            <span id="director-status">👤 Director: Niemand</span>
            <span id="clock" class="clock">00:00:00</span>
        </div>
    </div>

    <div class="content">
        <div id="current-scene-box" class="scene-panel">
            <div class="scene-title">🎬 Aktuelle Szene</div>
            <div class="scene-summary">—</div>
            <div class="roles">
                <div class="section-title">Rollen & Besetzung</div>
                <div class="roles-list" id="current-roles"></div>
            </div>
        </div>

        <div id="next-scene-box" class="scene-panel">
            <div class="scene-title">⏭️ Nächste Szene</div>
            <div class="scene-summary">—</div>
            <div class="roles">
                <div class="section-title">Rollen & Besetzung</div>
                <div class="roles-list" id="next-roles"></div>
            </div>
        </div>
    </div>

    <div class="bottom-progress">
        <div class="footer-info">
            <span>📊 Fortschritt</span>
            <span id="global-progress-text">0% (0/0)</span>
        </div>
        <div class="progress">
            <div class="progress-bar" id="global-progress-bar"></div>
        </div>
    </div>

    <script type="module" src="/static/js/viewer-actor.js"></script>
</body>

</html>
